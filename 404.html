<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>404 Not Found - ページが見つかりませんでした | Tools</title>
  <meta name="description" content="お探しのページは見つかりませんでした。移動または削除された可能性があります。">

  <link rel="stylesheet" href="/assets/css/common.css">

  <style>
    .not-found-wrapper {
      text-align: center;
      padding: 3rem 1rem 4rem;
      max-width: 600px;
      margin: 0 auto;
    }
    .error-illustration {
      max-width: 220px;
      width: 100%;
      height: auto;
      margin: 0 auto 1.5rem;
      display: block;
      filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.45));
    }
    .error-code {
      font-size: 3.5rem;
      font-weight: 800;
      color: var(--primary-color);
      line-height: 1;
      margin-bottom: 0.75rem;
      letter-spacing: -1px;
    }
    .error-title {
      font-size: 1.35rem;
      margin-bottom: 0.75rem;
      color: var(--text-color);
    }
    .error-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.7;
      margin-bottom: 2rem;
    }
    .quick-links {
      margin-top: 2.5rem;
      padding-top: 2rem;
      border-top: 1px solid var(--border-color);
      text-align: left;
    }
    .quick-links h3 {
      font-size: 1rem;
      color: var(--text-color);
      margin-bottom: 1rem;
      text-align: center;
    }
    .quick-links-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 0.75rem;
    }
    .quick-link-item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.75rem 1rem;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-color);
      text-decoration: none;
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }
    .quick-link-item:hover {
      border-color: var(--primary-color);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <a href="/">完全無料・ブラウザ完結型 メディアツール</a>
    </div>
  </header>

  <main>
    <div class="not-found-wrapper">
      <!-- 404キャラクターイラスト -->
      <img src="/assets/img/404.webp" alt="404 Not Found" class="error-illustration">

      <div class="error-code">404</div>
      <h1 class="error-title">ページが見つかりませんでした</h1>
      <p class="error-desc">
        お探しのページは、URLが変更されたか、削除された可能性があります。<br>
        URLに誤りがないか今一度ご確認いただくか、以下のトップページまたは主要ツールをご利用ください。
      </p>

      <a href="/" class="btn" style="display: inline-block; padding: 0.75rem 2rem; font-size: 0.95rem;">
        🏠 トップページへ戻る
      </a>

      <!-- 離脱防止用クイックリンク -->
      <div class="quick-links">
        <h3>おすすめの主要ツール</h3>
        <div class="quick-links-grid">
          <a href="/items/image-bg-remover/" class="quick-link-item">
            <span>🪄</span>
            <span>AI画像背景透過・切り抜き</span>
          </a>
          <a href="/items/image-compressor/" class="quick-link-item">
            <span>⚡</span>
            <span>画像一括圧縮・軽量化</span>
          </a>
          <a href="/items/pdf-merger/" class="quick-link-item">
            <span>📑</span>
            <span>PDF結合・画像PDF変換</span>
          </a>
          <a href="/items/text-counter/" class="quick-link-item">
            <span>✍️</span>
            <span>文字数カウント・原稿用紙</span>
          </a>
          <a href="/items/video-to-gif/" class="quick-link-item">
            <span>🔄</span>
            <span>動画GIF変換ツール</span>
          </a>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; Hidden Chimera All Rights Reserved.</p>
  </footer>

</body>
</html>
