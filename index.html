<html lang="ja">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>完全無料・ブラウザ完結型 メディアツール | Tools</title>
  <meta name="description" content="画像圧縮、PDF結合、動画変換、文字数カウントなど、すべての処理がお使いのブラウザ内（ローカル）で完結するWebツール集。サーバー送信ゼロで機密・プライバシーも万全です。">
  <meta name="keywords" content="画像圧縮,PDF結合,動画GIF変換,動画トリミング,文字数カウント,安全,サーバー送信なし,無料">

  <!-- OGP / Twitter Card -->
  <meta property="og:title" content="完全無料・ブラウザ完結型 メディアツール | Tools">
  <meta property="og:description" content="画像圧縮、PDF結合、動画変換、文字数カウントなど、すべての処理がお使いのブラウザ内（ローカル）で完結する安全なメディアツール集。">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="stylesheet" href="/assets/css/common.css">

  <style>
    .loading-notice {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <a href="/">完全無料・ブラウザ完結型 メディアツール</a>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1>ブラウザ完結型 メディアツール</h1>
      <p>すべての処理はお使いの端末（ブラウザ）内部で行われます。サーバーへのデータ送信は一切ありません。</p>
    </section>

    <!-- ツール一覧コンテナ（items.json から動的レンダリング） -->
    <div id="tools-container">
      <div class="loading-notice">ツール一覧を読み込み中...</div>
    </div>

    <noscript>
      <div style="padding: 1.5rem; background: var(--card-bg); border-radius: var(--radius); text-align: center; margin-top: 1rem;">
        <p>当ツールの利用にはJavaScriptの有効化が必要です。</p>
      </div>
    </noscript>
  </main>

  <footer>
    <p>&copy; Hidden Chimera All Rights Reserved.</p>
  </footer>

  <script src="/assets/js/common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const container = document.getElementById('tools-container');

      const iconMap = {
        film: '🎬',
        music: '🎵',
        scissors: '✂️',
        repeat: '🔄',
        image: '🖼️',
        maximize: '📐',
        shield: '🛡️',
        zap: '⚡',
        edit: '✍️',
        default: '🔧'
      };

      const categoryDefinitions = {
        'video-audio': {
          title: '動画・音声ツール',
          description: '動画の切り取り、GIF変換、音声抽出、フォーマット変換などをブラウザ内で高速処理'
        },
        'image': {
          title: '画像・PDFツール',
          description: '複数画像の一括圧縮、PDF結合、正方形化、プライバシー保護のモザイク加工'
        },
        'text': {
          title: 'テキストツール',
          description: '文字数カウント、400字詰原稿用紙換算、読了時間、リアルタイム推敲チェック'
        }
      };

      try {
        const res = await fetch('/items.json');
        if (!res.ok) throw new Error('items.json fetch error');
        const tools = await res.json();

        // カテゴリごとに仕分け
        const categorized = {
          'video-audio': [],
          'image': [],
          'text': []
        };

        tools.forEach(tool => {
          if (categorized[tool.category]) {
            categorized[tool.category].push(tool);
          }
        });

        let html = '';

        for (const [catKey, catInfo] of Object.entries(categoryDefinitions)) {
          const items = categorized[catKey];
          if (!items || items.length === 0) continue;

          html += `
            <section class="category-section">
              <h2 class="category-title">${catInfo.title}</h2>
              <div class="category-desc">${catInfo.description}</div>
              <div class="tool-grid">
          `;

          items.forEach(tool => {
            const icon = iconMap[tool.icon] || iconMap.default;
            const targetUrl = `/items/${tool.id}/`;
            const tagsHtml = (tool.tags || [])
              .map(tag => `<span class="tool-tag">${tag}</span>`)
              .join('');

            html += `
              <a href="${targetUrl}" class="tool-card">
                <div class="tool-card-icon">${icon}</div>
                <div class="tool-card-title">${tool.name}</div>
                <div class="tool-card-desc">${tool.description}</div>
                <div class="tool-card-tags">
                  ${tagsHtml}
                </div>
              </a>
            `;
          });

          html += `
              </div>
            </section>
          `;
        }

        container.innerHTML = html;

      } catch (err) {
        console.error(err);
        container.innerHTML = `
          <div class="loading-notice" style="color: #f87171;">
            ツールの読み込みに失敗しました。ページを再読み込みしてください。
          </div>
        `;
      }
    });
  </script>
</body>
</html>
