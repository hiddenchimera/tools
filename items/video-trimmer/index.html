<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>簡易動画トリミング・無音化ツール | Web Tools</title>
  <meta name="description" content="動画の指定区間切り取りや音声のミュート（無音化）をブラウザ内で行います。完全クライアント処理で安全・高速。">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <style>
    .breadcrumb {
      font-size: 0.875rem;
      margin-bottom: 1.5rem;
      color: var(--text-muted);
    }
    .breadcrumb a {
      color: var(--primary-color);
      text-decoration: none;
    }
    .editor-section {
      display: none;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-top: 1.5rem;
    }
    .video-preview {
      width: 100%;
      max-height: 380px;
      border-radius: 8px;
      background: #000;
      margin-bottom: 1.5rem;
    }
    .settings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    .input-group label {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .input-group input[type="number"] {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 0.6rem;
      border-radius: 6px;
    }
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.5rem;
      cursor: pointer;
    }
    .checkbox-group input {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    .output-section {
      display: none;
      text-align: center;
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border-color);
    }
    .output-video-preview {
      width: 100%;
      max-height: 380px;
      border-radius: 8px;
      background: #000;
      margin: 1rem 0;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <a href="../../">Web Tools</a>
    </div>
  </header>

  <main>
    <div class="breadcrumb">
      <a href="../../">トップ</a> &gt; 簡易動画トリミング・無音化ツール
    </div>

    <h2>簡易動画トリミング・無音化ツール</h2>
    <p style="color: var(--text-muted); margin-bottom: 1.5rem;">
      動画の前後を切り詰めて必要な区間だけを取り出したり、音声を完全に取り除いて無音動画を作成します。
    </p>

    <!-- ファイルドロップエリア -->
    <div id="dropzone" class="dropzone">
      <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">✂️</div>
      <h3>動画ファイルをドラッグ＆ドロップ</h3>
      <p>またはクリックしてファイルを選択（MP4, WebM, MOVなど）</p>
    </div>

    <!-- 編集設定エリア -->
    <div id="editor-section" class="editor-section">
      <video id="video-player" class="video-preview" controls></video>

      <div class="settings-grid">
        <div class="input-group">
          <label for="start-time">開始秒数 (秒)</label>
          <input type="number" id="start-time" min="0" step="0.1" value="0">
        </div>
        <div class="input-group">
          <label for="end-time">終了秒数 (秒)</label>
          <input type="number" id="end-time" min="0.1" step="0.1" value="10">
        </div>
      </div>

      <label class="checkbox-group">
        <input type="checkbox" id="mute-checkbox">
        <span>音声を削除する（無音化 / ミュート）</span>
      </label>

      <button id="process-btn" class="btn" style="width: 100%; margin-top: 1.5rem;">処理を開始する</button>

      <!-- プログレスバー -->
      <div id="progress-wrapper" style="display: none; margin-top: 1.5rem;">
        <div class="progress-container">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
        <p id="status-text" style="font-size: 0.85rem; color: var(--text-muted); text-align: center;">準備中...</p>
      </div>

      <!-- 出力エリア -->
      <div id="output-section" class="output-section">
        <h3>処理完了！</h3>
        <p id="output-size" style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 0.5rem;"></p>
        <video id="output-video" class="output-video-preview" controls></video>
        <div>
          <button id="download-btn" class="btn">編集済み動画をダウンロード</button>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Web Tools. All rights reserved.</p>
  </footer>

  <script src="../../assets/js/common.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
